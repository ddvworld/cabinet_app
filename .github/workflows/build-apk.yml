name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: دریافت کد از مخزن
        uses: actions/checkout@v4

      - name: نمایش ساختار پوشه‌ها (عیب‌یابی)
        run: |
          echo "=== مسیر فعلی ==="
          pwd
          echo "=== لیست فایل‌ها و پوشه‌ها ==="
          ls -la
          echo "=== جستجوی pubspec.yaml ==="
          find . -name "pubspec.yaml" -type f
          echo "=== محتوای پوشه cabinet_app (اگر وجود دارد) ==="
          if [ -d "cabinet_app" ]; then
            echo "پوشه cabinet_app وجود دارد:"
            ls -la cabinet_app
          else
            echo "پوشه cabinet_app وجود ندارد"
          fi

      - name: نصب Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: "17"

      - name: نصب Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: دریافت وابستگی‌های پروژه
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "pubspec.yaml در ریشه پیدا شد"
            flutter pub get
          elif [ -f "cabinet_app/pubspec.yaml" ]; then
            echo "pubspec.yaml در پوشه cabinet_app پیدا شد"
            cd cabinet_app && flutter pub get
          else
            echo "خطا: pubspec.yaml پیدا نشد!"
            echo "لیست کامل فایل‌ها:"
            find . -type f -name "*.yaml"
            exit 1
          fi

      - name: ساخت فایل APK نهایی
        run: |
          if [ -f "pubspec.yaml" ]; then
            flutter build apk --release
          elif [ -f "cabinet_app/pubspec.yaml" ]; then
            cd cabinet_app && flutter build apk --release
          else
            exit 1
          fi

      - name: آپلود فایل APK ساخته شده
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            cabinet_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: ignore