name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: دریافت کد از مخزن
        uses: actions/checkout@v4

      - name: نمایش ساختار پوشه (برای عیب‌یابی)
        run: |
          echo "محتوای پوشه فعلی:"
          ls -la
          echo "محتوای پوشه cabinet_app (اگر وجود دارد):"
          ls -la cabinet_app || echo "پوشه cabinet_app وجود ندارد"

      - name: نصب Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: "17"

      - name: نصب Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: دریافت وابستگی‌های پروژه
        run: flutter pub get
        # working-directory را حذف کنید یا اصلاح کنید

      - name: ساخت فایل APK نهایی
        run: flutter build apk --release
        # working-directory را حذف کنید یا اصلاح کنید

      - name: آپلود فایل APK ساخته شده
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk